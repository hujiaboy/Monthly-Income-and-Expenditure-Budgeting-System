function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(() => auth.signInWithRedirect(provider));
}
function logout() { auth.signOut(); }

function setRecordType(type) {
  document.getElementById("recType").value = type;
  const isExp = (type === 'expense');
  const btnExp = document.getElementById("typeBtnExpense");
  const btnInc = document.getElementById("typeBtnIncome");

  if (isExp) {
    btnExp.className = "py-2 rounded-xl font-bold border-2 border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 transition flex items-center justify-center gap-1";
    btnInc.className = "py-2 rounded-xl font-bold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1";
  } else {
    btnInc.className = "py-2 rounded-xl font-bold border-2 border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 transition flex items-center justify-center gap-1";
    btnExp.className = "py-2 rounded-xl font-bold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1";
  }
  updateCategoryDropdown();
}

function updateCategoryDropdown() {
  const type = document.getElementById("recType").value;
  const sel = document.getElementById("recCategory");
  sel.innerHTML = "";
  const list = CATEGORIES[type] || [];
  list.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function renderPresets() {
  const bar = document.getElementById("presetsBar");
  bar.innerHTML = "";
  DEFAULT_PRESETS.forEach(p => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "px-2 py-0.5 bg-slate-100 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-950 text-slate-700 dark:text-slate-300 rounded-lg text-[11px] font-semibold border border-slate-200 dark:border-slate-700 transition";
    btn.textContent = p.label;
    btn.onclick = () => {
      setRecordType(p.type);
      document.getElementById("recCategory").value = p.category;
      document.getElementById("recAccount").value = p.account;
      document.getElementById("recAmount").value = p.money;
      document.getElementById("recNote").value = p.remark;
    };
    bar.appendChild(btn);
  });
}

function startVoiceInput() {
  if (!("webkitSpeechRecognition" in window)) return alert("此瀏覽器不支援語音辨識功能！");
  const rec = new webkitSpeechRecognition();
  rec.lang = "zh-HK";
  rec.interimResults = false;
  rec.onresult = (ev) => {
    document.getElementById("recNote").value = ev.results[0][0].transcript;
  };
  rec.start();
}

// 即時監聽 bills/{uid}
function listenToUserData() {
  if (!currentUser) return;
  db.ref(`bills/${currentUser.uid}`).on('value', (snap) => {
    const val = snap.val() || {};
    allBillsList = Object.entries(val).map(([key, item]) => {
      const money = parseFloat(item.money || item.amount || 0);
      const day = item.day || item.date || "";
      const remark = item.remark || item.note || "";
      let account = item.account;
      if (!account) {
        if (item.category === "現金" || item.payment === "現金" || item.payment === "八達通") account = "cash";
        else account = "bank";
      }
      return { key, ...item, money, day, remark, account };
    }).filter(r => r.day && r.type);

    updateMonthDropdown();
    renderAssets();
    fetchBudgetsAndRender();
  });
}

function updateMonthDropdown() {
  const selectEl = document.getElementById("monthSelectEl");
  const currentVal = selectEl.value || "ALL";
  const monthSet = new Set();
  allBillsList.forEach(r => {
    if (r.day && r.day.length >= 7) monthSet.add(r.day.substring(0, 7));
  });
  const sortedMonths = Array.from(monthSet).sort().reverse();

  selectEl.innerHTML = `<option value="ALL">📋 顯示全部歷史記錄 (共 ${allBillsList.length} 筆)</option>`;
  sortedMonths.forEach(ym => {
    const opt = document.createElement("option");
    opt.value = ym;
    opt.textContent = `📅 ${ym.replace('-', '年')}月`;
    selectEl.appendChild(opt);
  });

  if (sortedMonths.includes(currentVal) || currentVal === "ALL") {
    selectEl.value = currentVal;
  }
  selectedMonth = selectEl.value;
}

function onMonthSelectChange() {
  selectedMonth = document.getElementById("monthSelectEl").value;
  fetchBudgetsAndRender();
}

function fetchBudgetsAndRender() {
  if (!currentUser) return;
  const ym = (selectedMonth === "ALL") ? new Date().toISOString().slice(0, 7) : selectedMonth;
  db.ref(`budgets/${currentUser.uid}/${ym}`).once('value', (bSnap) => {
    budgetsData = bSnap.val() || {};
    renderDashboard();
  });
}

function renderAssets() {
  let cashTotal = 0;
  let bankTotal = 0;

  allBillsList.forEach(item => {
    const amt = item.money;
    const isCash = (item.account === 'cash');
    if (item.type === 'income') {
      if (isCash) cashTotal += amt; else bankTotal += amt;
    } else if (item.type === 'expense') {
      if (isCash) cashTotal -= amt; else bankTotal -= amt;
    } else if (item.type === 'calibration') {
      if (isCash) cashTotal += amt; else bankTotal += amt;
    }
  });

  document.getElementById("accCashBalance").textContent = `HK$ ${cashTotal.toLocaleString('en-US', { minimumFractionDigits: 1 })}`;
  document.getElementById("accBankBalance").textContent = `HK$ ${bankTotal.toLocaleString('en-US', { minimumFractionDigits: 1 })}`;
}    function renderDashboard() {
      const items = allBillsList.filter(item => {
        if (selectedMonth !== "ALL" && !item.day.startsWith(selectedMonth)) return false;
        return true;
      }).sort((a, b) => new Date(b.day) - new Date(a.day));

      let totalIncome = 0;
      let totalExpense = 0;
      const expenseByCategory = {};
      CATEGORIES.expense.forEach(c => expenseByCategory[c] = 0);

      items.forEach(item => {
        if (item.type === 'income') totalIncome += item.money;
        else if (item.type === 'expense') {
          totalExpense += item.money;
          expenseByCategory[item.category] = (expenseByCategory[item.category] || 0) + item.money;
        }
      });

      const balance = totalIncome - totalExpense;

      document.getElementById("kpiIncome").textContent = `$${totalIncome.toLocaleString('en-US', { minimumFractionDigits: 1 })}`;
      document.getElementById("kpiExpense").textContent = `$${totalExpense.toLocaleString('en-US', { minimumFractionDigits: 1 })}`;
      document.getElementById("kpiBalance").textContent = `$${balance.toLocaleString('en-US', { minimumFractionDigits: 1 })}`;
      document.getElementById("kpiBalance").className = `font-black mt-0.5 text-xs truncate ${balance >= 0 ? 'text-slate-800 dark:text-white' : 'text-rose-600'}`;
      document.getElementById("recordCount").textContent = `共 ${items.length} 筆`;

      const container = document.getElementById("recordsListContainer");
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs">此範圍內暫無任何收支紀錄</div>`;
      } else {
        items.forEach(item => {
          const isExp = (item.type === 'expense');
          const isCalib = (item.type === 'calibration');
          const div = document.createElement("div");
          div.className = "p-3 flex justify-between items-center text-xs hover:bg-slate-50 dark:hover:bg-slate-800/40 transition";

          let amtDisplay = '';
          if (isCalib) {
            amtDisplay = `<span class="font-mono font-bold ${item.money >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${item.money >= 0 ? '+' : ''}$${item.money.toFixed(1)}</span>`;
          } else if (isExp) {
            amtDisplay = `<span class="font-mono font-bold text-rose-600">-$${item.money.toFixed(1)}</span>`;
          } else {
            amtDisplay = `<span class="font-mono font-bold text-emerald-600">+$${item.money.toFixed(1)}</span>`;
          }

          div.innerHTML = `
            <div class="flex-1 min-w-0 pr-2">
              <div class="flex items-center gap-1.5 font-bold text-slate-800 dark:text-slate-200">
                <span>${item.day}</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded ${item.account === 'cash' ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-400' : 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-400'}">${item.account === 'cash' ? '現金' : '銀行'}</span>
                <span class="truncate">${item.category}</span>
              </div>
              <div class="text-[11px] text-slate-400 truncate mt-0.5">${item.remark || '-'}</div>
            </div>
            <div class="flex items-center gap-2">
              ${amtDisplay}
              <button onclick="deleteRecord('${item.key}')" class="text-slate-300 hover:text-rose-600 p-1">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          `;
          container.appendChild(div);
        });
      }

      renderCategoryBudgets(expenseByCategory);
      renderChart(expenseByCategory);
    }

    function renderCategoryBudgets(expenseByCategory) {
      const container = document.getElementById("categoryBudgetList");
      container.innerHTML = "";

      Object.keys(expenseByCategory).forEach(cat => {
        const spent = expenseByCategory[cat] || 0;
        const budget = budgetsData[cat] || 0;
        if (budget > 0 || spent > 0) {
          const pct = budget > 0 ? Math.round((spent / budget) * 100) : 100;
          const isOver = budget > 0 && spent > budget;
          const div = document.createElement("div");
          div.className = "text-[11px]";
          div.innerHTML = `
            <div class="flex justify-between items-center mb-0.5">
              <span class="font-bold text-slate-700 dark:text-slate-300">${cat}</span>
              <span class="${isOver ? 'text-rose-600 font-bold' : 'text-slate-500'}">
                $${spent.toFixed(0)} / $${budget.toFixed(0)} (${pct}%)
              </span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-1 overflow-hidden">
              <div class="h-1 rounded-full ${isOver ? 'bg-rose-500' : 'bg-indigo-500'}" style="width: ${Math.min(pct, 100)}%"></div>
            </div>
          `;
          container.appendChild(div);
        }
      });
    }

    function renderChart(expenseByCategory) {
      const ctx = document.getElementById("expenseChart").getContext("2d");
      const labels = Object.keys(expenseByCategory).filter(k => expenseByCategory[k] > 0);
      const data = labels.map(k => expenseByCategory[k]);

      if (chartInstance) chartInstance.destroy();
      if (data.length === 0) return;

      const isDark = document.documentElement.classList.contains('dark');
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#14b8a6', '#f43f5e', '#64748b'],
            borderWidth: 2,
            borderColor: isDark ? '#0f172a' : '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { color: isDark ? '#cbd5e1' : '#475569', font: { size: 10 } } }
          }
        }
      });
    }

    function handleCreateRecord(e) {
      e.preventDefault();
      if (!currentUser) return;

      const type = document.getElementById("recType").value;
      const account = document.getElementById("recAccount").value;
      const day = document.getElementById("recDate").value;
      const category = document.getElementById("recCategory").value;
      const money = parseFloat(document.getElementById("recAmount").value);
      const remark = document.getElementById("recNote").value.trim();

      if (isNaN(money) || money <= 0) return alert("請輸入正確金額！");

      const payload = {
        type, category, money, day, remark, account,
        timestamp: new Date().getTime()
      };

      db.ref(`bills/${currentUser.uid}`).push(payload, (err) => {
        if (!err) {
          document.getElementById("recAmount").value = "";
          document.getElementById("recNote").value = "";
        } else {
          alert("儲存失敗: " + err.message);
        }
      });
    }

    function deleteRecord(key) {
      if (!confirm("確定要刪除這筆紀錄嗎？將即時同步至舊系統。")) return;
      db.ref(`bills/${currentUser.uid}/${key}`).remove();
    }

    function openCalibrateModal(acc) {
      calibratingAccount = acc;
      document.getElementById("calibModalTitle").textContent = acc === 'cash' ? "校對【現金】餘額" : "校對【銀行】餘額";
      let sysBal = 0;
      allBillsList.forEach(item => {
        let a = item.account || (item.category === "現金" ? 'cash' : 'bank');
        if (a === acc) {
          if (item.type === 'income' || item.type === 'calibration') sysBal += item.money;
          else if (item.type === 'expense') sysBal -= item.money;
        }
      });
      document.getElementById("calibCurrentSysBal").textContent = `HK$ ${sysBal.toFixed(1)}`;
      document.getElementById("calibRealAmount").value = "";
      document.getElementById("calibrateModal").classList.remove("hidden");
    }
    function closeCalibrateModal() { document.getElementById("calibrateModal").classList.add("hidden"); }

    function handleSaveCalibration() {
      const realAmt = parseFloat(document.getElementById("calibRealAmount").value);
      if (isNaN(realAmt)) return alert("請填寫真實盤點金額！");

      let sysBal = 0;
      allBillsList.forEach(item => {
        let a = item.account || (item.category === "現金" ? 'cash' : 'bank');
        if (a === calibratingAccount) {
          if (item.type === 'income' || item.type === 'calibration') sysBal += item.money;
          else if (item.type === 'expense') sysBal -= item.money;
        }
      });

      const diff = realAmt - sysBal;
      if (Math.abs(diff) < 0.01) {
        alert("金額與系統相符，無須調整！");
        return closeCalibrateModal();
      }

      const today = new Date().toISOString().slice(0, 10);
      const calibPayload = {
        type: 'calibration',
        category: "資產校準調整",
        money: diff,
        day: today,
        remark: `盤點校對 (原值: $${sysBal.toFixed(1)} -> 實盤: $${realAmt.toFixed(1)})`,
        account: calibratingAccount,
        timestamp: new Date().getTime()
      };

      db.ref(`bills/${currentUser.uid}`).push(calibPayload, (err) => {
        if (!err) closeCalibrateModal();
      });
    }

    function openBudgetModal() {
      const form = document.getElementById("budgetSettingForm");
      form.innerHTML = "";
      CATEGORIES.expense.forEach(cat => {
        const val = budgetsData[cat] || "";
        const row = document.createElement("div");
        row.className = "flex items-center justify-between gap-2";
        row.innerHTML = `
          <label class="font-bold text-slate-700 dark:text-slate-300 truncate w-28">${cat}</label>
          <input type="number" step="50" name="${cat}" value="${val}" placeholder="0" class="w-28 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-xs font-bold bg-white dark:bg-slate-800 dark:text-white outline-none" />
        `;
        form.appendChild(row);
      });
      document.getElementById("budgetModal").classList.remove("hidden");
    }
    function closeBudgetModal() { document.getElementById("budgetModal").classList.add("hidden"); }

    function handleSaveBudgets() {
      const formData = new FormData(document.getElementById("budgetSettingForm"));
      const newBudgets = {};
      formData.forEach((value, key) => {
        const num = parseFloat(value);
        if (!isNaN(num) && num >= 0) newBudgets[key] = num;
      });
      const ym = (selectedMonth === "ALL") ? new Date().toISOString().slice(0, 7) : selectedMonth;
      db.ref(`budgets/${currentUser.uid}/${ym}`).set(newBudgets, (err) => {
        if (!err) closeBudgetModal(); else alert("預算儲存失敗: " + err.message);
      });
    }

    // ★★★★★ 豪华 Excel 导出（使用 ExcelJS 实现样式）★★★★★
    async function exportDeluxeExcel() {
      if (!currentUser) return alert("請先登入");
      const items = allBillsList.filter(item => {
        if (selectedMonth !== "ALL" && !item.day.startsWith(selectedMonth)) return false;
        return true;
      }).sort((a, b) => new Date(a.day) - new Date(b.day));

      if (items.length === 0) return alert("當前範圍內無資料可匯出！");

      let totalIncome = 0, totalExpense = 0;
      const expSum = {};
      items.forEach(item => {
        if (item.type === 'income') totalIncome += item.money;
        else if (item.type === 'expense') {
          totalExpense += item.money;
          expSum[item.category] = (expSum[item.category] || 0) + item.money;
        }
      });
      const net = totalIncome - totalExpense;
      const periodLabel = (selectedMonth === "ALL") ? "全歷史記錄" : `${selectedMonth} 月度報表`;

      const workbook = new ExcelJS.Workbook();
      workbook.creator = '智能雙賬戶記帳系統';
      workbook.created = new Date();

      const ws1 = workbook.addWorksheet('財務總結', { views: [{ state: 'frozen', ySplit: 5 }] });

      const titleRow = ws1.addRow(['智能雙賬戶財務收支與預算分析總表']);
      ws1.mergeCells(`A${titleRow.number}:F${titleRow.number}`);
      const titleCell = titleRow.getCell(1);
      titleCell.font = { size: 18, bold: true, color: { argb: 'FFFFFFFF' } };
      titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4F46E5' } };
      titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
      ws1.getRow(titleRow.number).height = 40;

      const subRow = ws1.addRow([`統計週期：${periodLabel}`]);
      ws1.mergeCells(`A${subRow.number}:F${subRow.number}`);
      subRow.getCell(1).font = { size: 12, bold: true, color: { argb: 'FF334155' } };
      subRow.getCell(1).alignment = { horizontal: 'center' };
      ws1.getRow(subRow.number).height = 25;

      ws1.addRow([]);

      const header1 = ws1.addRow(['核心財務指標', '金額 (HKD)']);
      header1.eachCell((cell) => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = { top: { style: 'medium' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
      });
      ws1.getRow(header1.number).height = 28;

      const dataRows = [
        ['總收入 (含各項津貼)', totalIncome],
        ['總支出', totalExpense],
        ['淨盈餘 / 儲蓄結餘', net]
      ];
      dataRows.forEach(([label, val]) => {
        const row = ws1.addRow([label, val]);
        row.eachCell((cell, col) => {
          cell.alignment = { horizontal: col === 1 ? 'left' : 'right', vertical: 'middle' };
          cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
          if (col === 2) cell.font = { bold: true, color: { argb: val >= 0 ? 'FF10B981' : 'FFEF4444' } };
          if (col === 1) cell.font = { bold: true };
        });
      });

      ws1.addRow([]);

      const header2 = ws1.addRow(['開支分類', '設定預算 (HKD)', '實際支出 (HKD)', '預算差額 (HKD)', '執行率 (%)']);
      header2.eachCell((cell) => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF334155' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = { top: { style: 'medium' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
      });
      ws1.getRow(header2.number).height = 28;

      let totalBudget = 0;
      CATEGORIES.expense.forEach(cat => {
        const budget = budgetsData[cat] || 0;
        const actual = expSum[cat] || 0;
        totalBudget += budget;
        const diff = budget - actual;
        const pct = budget > 0 ? (actual / budget * 100).toFixed(1) + '%' : '-';
        const row = ws1.addRow([cat, budget, actual, diff, pct]);
        row.eachCell((cell, col) => {
          cell.alignment = { horizontal: col === 1 ? 'left' : 'right', vertical: 'middle' };
          cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
          if (col === 4 && diff < 0) cell.font = { color: { argb: 'FFEF4444' } };
        });
      });

      const totalRow = ws1.addRow(['總計', totalBudget, totalExpense, totalBudget - totalExpense, totalBudget > 0 ? (totalExpense / totalBudget * 100).toFixed(1) + '%' : '-']);
      totalRow.eachCell((cell, col) => {
        cell.font = { bold: true };
        cell.alignment = { horizontal: col === 1 ? 'left' : 'right', vertical: 'middle' };
        cell.border = { top: { style: 'medium' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
        if (col === 4 && totalBudget - totalExpense < 0) cell.font.color = { argb: 'FFEF4444' };
      });

      ws1.getColumn(1).width = 20;
      ws1.getColumn(2).width = 18;
      ws1.getColumn(3).width = 18;
      ws1.getColumn(4).width = 18;
      ws1.getColumn(5).width = 14;

      const ws2 = workbook.addWorksheet('收支明細', { views: [{ state: 'frozen', ySplit: 1 }] });

      const titleRow2 = ws2.addRow(['交易日期', '入帳賬戶', '收支類型', '分類項目', '金額 (HKD)', '備註說明']);
      titleRow2.eachCell((cell) => {
        cell.font = { bold: true, size: 12, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = { top: { style: 'medium' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
      });
      ws2.getRow(titleRow2.number).height = 28;

      items.forEach(item => {
        const typeLabel = item.type === 'income' ? '收入/津貼' : (item.type === 'expense' ? '支出' : '校對調帳');
        const row = ws2.addRow([
          item.day,
          item.account === 'cash' ? '現金' : '銀行',
          typeLabel,
          item.category,
          item.money,
          item.remark || ''
        ]);
        row.eachCell((cell, col) => {
          cell.alignment = { horizontal: col === 5 ? 'right' : 'left', vertical: 'middle' };
          cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
          if (col === 5) {
            cell.font = { bold: true, color: { argb: item.type === 'income' ? 'FF10B981' : (item.type === 'expense' ? 'FFEF4444' : 'FF6366F1') } };
          }
        });
      });

      ws2.getColumn(1).width = 14;
      ws2.getColumn(2).width = 12;
      ws2.getColumn(3).width = 14;
      ws2.getColumn(4).width = 18;
      ws2.getColumn(5).width = 16;
      ws2.getColumn(6).width = 30;

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${periodLabel.replace(/\s/g, '_')}_豪華收支報表.xlsx`;
      link.click();
    }
  </script>
</body>
